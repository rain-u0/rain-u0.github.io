<!DOCTYPE html>
<html lang="en">
<!--
  ═══════════════════════════════════════════════════════════════
  rain_u.0 — admin

  Edits the repo through the GitHub API. Nothing secret lives in
  this file: it is a form, and a form is useless without the token
  the operator pastes at runtime. That token is held in memory for
  the life of the tab and is never stored — closing the tab is the
  logout, which is one fewer thing to remember on a borrowed
  machine.

  In English, alone among the pages here. The site itself ships in
  four languages because it has readers; this has one operator, and
  translating it four ways would be four times the strings to keep
  in step for no one's benefit.
  ═══════════════════════════════════════════════════════════════
-->
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>rain_u.0 — Admin</title>
  <link rel="stylesheet" href="css/admin.css">
</head>
<body>

  <!-- ── Sign in ─────────────────────────────────────────────
       Shown until a token proves itself against the API. -->
  <section class="gate" id="gate">
    <div class="gate__box">
      <h1>rain_u.0</h1>
      <p class="gate__hint">Paste a GitHub personal access token</p>

      <form id="gate-form" autocomplete="off">
        <input type="password" id="token" placeholder="github_pat_…"
               spellcheck="false" autocomplete="off" required>
        <button type="submit" id="gate-go">Sign in</button>
      </form>

      <p class="gate__err" id="gate-err" hidden></p>

      <p class="gate__note">
        Needs a fine-grained token scoped to
        <code>rain-u0.github.io</code> with Contents read and write.<br>
        The token is never stored. Closing this tab signs you out.
      </p>
    </div>
  </section>

  <!-- ── Editor ──────────────────────────────────────────── -->
  <main class="app" id="app" hidden>
    <header class="bar">
      <div class="bar__left">
        <strong>rain_u.0</strong>
        <span class="bar__count" id="count">—</span>
      </div>
      <div class="bar__right">
        <span class="bar__state" id="state"></span>
        <button type="button" id="reload" class="btn btn--ghost">Reload</button>
        <button type="button" id="save" class="btn btn--go" disabled>Save</button>
        <button type="button" id="logout" class="btn btn--ghost">Sign out</button>
      </div>
    </header>

    <!-- Filled by js/admin.js: one section per category, rows inside -->
    <div class="groups" id="groups"></div>
  </main>

  <div class="toast" id="toast" hidden></div>

  <script src="js/admin.js"></script>
</body>
</html>
